             class="object-contain"

             class="object-contain opacity-70"
             alt="time">

            00:00:00

<script>
    function updateClock() {
        const now = new Date();

        // แปลงเวลาเป็นรูปแบบ HH:mm:ss
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        const timeString = `${hours}:${minutes}:${seconds}`;

        // ใส่เวลาลงใน Element ที่มี id="live-clock"
        const clockElement = document.getElementById('live-clock');
        if (clockElement) {
            clockElement.textContent = timeString;
        }
    }

    // เรียกฟังก์ชันทุกๆ 1,000 มิลลิวินาที (1 วินาที)
    setInterval(updateClock, 1000);

    // เรียกใช้งานทันที 1 ครั้งตอนโหลดหน้าจอ เพื่อไม่ให้ขึ้น 00:00:00 รอ
    updateClock();
</script>
