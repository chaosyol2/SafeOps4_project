<script>
    function updateClock() {
        const now = new Date();

        // แปลงเวลาเป็นรูปแบบ HH:mm:ss
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        const timeString = `${hours}:${minutes}:${seconds}`;

        // ใส่เวลาลงใน Element ที่มี id="live-clock"
        const clockElement = document.getElementById('live-clock');
        if (clockElement) {
            clockElement.textContent = timeString;
        }
    }

    // เรียกฟังก์ชันทุกๆ 1,000 มิลลิวินาที (1 วินาที)
    setInterval(updateClock, 1000);

    // เรียกใช้งานทันที 1 ครั้งตอนโหลดหน้าจอ เพื่อไม่ให้ขึ้น 00:00:00 รอ
    updateClock();
</script>


<script>
    /**
     * ฟังก์ชันสำหรับอัปเดตจำนวนเครื่องจักร
     * @param {number} newCount - จำนวนเครื่องจักรใหม่ที่ต้องการแสดง
     */
    function updateTotalMachines(newCount) {
        // หา Element ที่มี ID เป็น 'total-machines-count'
        const countElement = document.getElementById('total-machines-count');

        // ตรวจสอบว่ามี Element นี้อยู่จริงไหม
        if (countElement) {
            // อัปเดตเนื้อหาข้างในด้วยตัวเลขใหม่
            // ใช้ .padStart เพื่อให้เป็นเลข 2 หลักเสมอ (เช่น 05, 10, 25)
            countElement.textContent = String(newCount).padStart(2, '0');

            // แถม: ใส่เอฟเฟกต์กะพริบเล็กน้อยเวลาเลขเปลี่ยน (เพื่อดึงดูดสายตา)
            countElement.classList.add('animate-pulse');
            setTimeout(() => {
                countElement.classList.remove('animate-pulse');
            }, 1000); // กะพริบ 1 วินาทีแล้วหยุด
        }
    }

    // --- วิธีเรียกใช้งาน (ตัวอย่าง) ---

    // 1. เรียกใช้งานทันทีตอนโหลดหน้า (เช่น ตั้งค่าเริ่มต้นเป็น 30)
    window.onload = function() {
        updateTotalMachines(20);
    };

    // 2. ตัวอย่างการเปลี่ยนค่าแบบ Real-time (สมมติว่ามีข้อมูลใหม่มาทุก 5 วินาที)

    //     const randomNumber = Math.floor(Math.random() * (40 - 20 + 1)) + 20;
    //     updateTotalMachines(randomNumber);
    // }, 5000);

</script>

<script>
    // 1. ฟังก์ชันสำหรับนับกล่องที่มีสี เหลือง หรือ แดง และอัปเดตตัวเลข
    function updateAlertCounter() {
        // เลือกกล่องทั้งหมดที่มีคลาสสีเหลือง หรือ สีแดง
        const activeBoxes = document.querySelectorAll('.box.active-yellow, .box.active-red');
        const totalAlerts = activeBoxes.length; // จำนวนที่นับได้

        // ส่งตัวเลขที่นับได้ไปที่ฟังก์ชันแสดงผล
        updateTotalAlert(totalAlerts);
    }

    // 2. ฟังก์ชันแสดงผล (ที่คุณมีอยู่แล้ว แต่ปรับ ID ให้ตรงกัน)
    function updateTotalAlert(newCount) {
        const countElement = document.getElementById('total-alert-count');
        if (countElement) {
            countElement.textContent = String(newCount).padStart(2, '0');

            // ใส่ Effect กะพริบเฉพาะตอนที่ตัวเลขเปลี่ยน
            countElement.classList.add('animate-pulse');
            setTimeout(() => {
                countElement.classList.remove('animate-pulse');
            }, 500);
        }
    }

    // 3. ตั้งค่า Click Event ให้กับทุกกล่อง
    const boxes = document.querySelectorAll('.box');
    boxes.forEach(box => {
        box.addEventListener('click', function() {
            // โลจิกเปลี่ยนสี (เหลือง -> แดง -> ปกติ)
            if (!this.classList.contains('active-yellow') && !this.classList.contains('active-red')) {
                this.classList.add('active-yellow');
            } else if (this.classList.contains('active-yellow')) {
                this.classList.remove('active-yellow');
                this.classList.add('active-red');
            } else {
                this.classList.remove('active-red');
            }

            // --- หัวใจสำคัญ: ทุกครั้งที่คลิก ให้สั่ง "นับใหม่" ทันที ---
            updateAlertCounter();
        });
    });

    // 4. สั่งให้นับครั้งแรกตอนโหลดหน้าเว็บ (เผื่อมีค่าเริ่มต้น)
    window.onload = function() {
        updateAlertCounter();
    };
</script>



<script>
    function updateAvgRisk(newCount) {
        const countElement = document.getElementById('avg-risk-count');

            countElement.textContent = String(newCount).padStart(2, '0');
            countElement.classList.add('animate-pulse');
            setTimeout(() => {
                countElement.classList.remove('animate-pulse');
            }, 1000);
        }
    }
    window.onload = function() {
        updateAvgRisk(30);
    };

</script>



<script>
    // เลือกกล่องทั้งหมดที่มีคลาส .box
    const boxes = document.querySelectorAll('.box');

    boxes.forEach(box => {
        box.addEventListener('click', function() {
            if (!this.classList.contains('active-yellow') && !this.classList.contains('active-red')) {
                // คลิกครั้งที่ 1: เปลี่ยนเป็นเหลือง
                this.classList.add('active-yellow');
            } else if (this.classList.contains('active-yellow')) {
                // คลิกครั้งที่ 2: เปลี่ยนจากเหลืองเป็นแดง
                this.classList.remove('active-yellow');
                this.classList.add('active-red');
            } else {
                // คลิกครั้งที่ 3: กลับเป็นสีน้ำเงินปกติ
                this.classList.remove('active-red');
            }
        });
    });
</script>

<script>
    function toggleNotification() {
        const bell = document.getElementById('noti-icon');

        // ตรวจสอบว่า src ปัจจุบันมีคำว่า Unnoti อยู่หรือไม่
        if (bell.src.includes('Unnoti_bell.png')) {
            // ถ้าเป็น Unnoti ให้เปลี่ยนเป็น Noti (กระดิ่งมีแจ้งเตือน)
            bell.src = 'source/Noti_bell.png';
            bell.classList.remove('opacity-70'); // ทำให้สว่างขึ้นเมื่อมีแจ้งเตือน (Optional)
            bell.classList.add('opacity-100');
        } else {
            // ถ้าเป็น Noti ให้เปลี่ยนกลับเป็น Unnoti (ไม่มีแจ้งเตือน)
            bell.src = 'source/Unnoti_bell.png';
            bell.classList.add('opacity-70');    // กลับไปจางเหมือนเดิม
            bell.classList.remove('opacity-100');
        }
    }
</script>
