<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event History | Smart Factory</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

   <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --line-green: #06C755;
            --accent-blue: #38bdf8;
        }

        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif; /* ฟอนต์หลักที่อ่านง่าย */
            margin: 0;
            padding: 20px;
        }

        .font-tech { font-family: 'Orbitron', sans-serif; }

        /* การตกแต่งตาราง */
        .log-container {
            background: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(255,255,255,0.05);
            padding: 16px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--accent-blue);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        td {
            padding: 14px 20px;
             font-family: 'Inter', sans-serif;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
            vertical-align: middle;
        }

        tr:hover { background: rgba(255,255,255,0.03); }

        /* จัดการสถานะแจ้งเตือน Line */
        .line-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(6, 199, 85, 0.15);
            color: var(--line-green);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
        }

        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot-red { background: #ff4444; box-shadow: 0 0 8px #ff4444; }
        .dot-blue { background: var(--accent-blue); box-shadow: 0 0 8px var(--accent-blue); }
        .dot-green { background: var(--line-green); }

        .text-muted { color: #94a3b8; font-size: 11px; }
        .machine-id { font-weight: 600; color: #fff; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="container">
    <div>
        <a href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='images/app_logo.jpg') }}" height="50" class="object-contain" alt="Logo">
    </a>
    </div>

    <div class="push-right">
        <div class="history-link-container">
            <a href="{{ url_for('history_page') }}" class="history-link" style="color: #00f2fe;">
                | &nbsp; History &nbsp; |
            </a>
        </div>
        <div class="history-link-container">
            <a href="{{ url_for('team_page') }}" class="history-link" >
                  | &nbsp; Team &nbsp; |
            </a>
        </div>
        <img src="./static/images/live_logo_on.png" height="40" class="object-contain opacity-70" alt="time">
        <span id="live-clock" class="text-white !important font-['Orbitron'] text-[9px] font-bold tracking-widest">
            00:00:00
        </span>
        <img id="notiIcon" src="./static/images/Unnoti_bell.png" height="30" style="cursor: pointer;" onclick="toggleNoti()" alt="Notification">
        <img src="./static/images/Denso_logo.png" height="30" class="object-contain opacity-70" alt="brand">
    </div>
</div>

<div class="info-panel" style="flex-direction: column; margin-top: 20px;">
    <div class="panel-header" style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <span style="color: #00f2fe; font-family: 'Orbitron'; font-size: 18px;">> SYSTEM EVENT LOGS</span>
            <div style="font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 5px;">Historical Tracking & AI Predictive Maintenance</div>
        </div>
        <div style="text-align: right;">
            <span style="font-size: 12px; color: #ffcc00;">Live Status: Active Monitoring</span>
        </div>
    </div>

    <div class="history-table">
        <table id="eventLogTable">
            <thead>
                <tr>
                    <th>TIMESTAMP</th>
                    <th>MACHINE</th>
                    <th>EVENT TYPE</th>
                    <th>DESCRIPTION</th>
                    <th>RISK</th>
                    <th>STATUS</th>
                    <th>ACTION TAKEN</th>
                    <th>PIC (OPERATOR)</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
</div>

<script>
    const operators = ["Mimi", "Yok", "Marco", "Little", "Puth", "Mark"];
    const machines = ["CNC-01", "CNC-02", "ROBOT-A1", "ROBOT-B2", "CNC-05", "ARM-X1"];

    // ชุดข้อมูลตัวอย่างสำหรับจำลองสถานะต่างๆ
    const eventTypes = [
        { type: "Predictive Alert", desc: "Vibration pattern suggests bearing wear", risk: "MEDIUM", status: "PREDICTIVE", action: "Schedule Check", riskCls: "risk-medium", statCls: "status-predictive" },
        { type: "Critical Failure", desc: "Spindle motor overcurrent - emergency stop", risk: "HIGH", status: "WARNING", action: "Repairing", riskCls: "risk-high", statCls: "status-warning" },
        { type: "Maintenance", desc: "Monthly sensor recalibration completed", risk: "LOW", status: "RESOLVED", action: "None", riskCls: "risk-low", statCls: "status-resolved" },
        { type: "System Alert", desc: "Coolant pressure below optimal level", risk: "MEDIUM", status: "PENDING", action: "Waiting PIC", riskCls: "risk-medium", statCls: "status-pending" },
        { type: "Operational", desc: "Production cycle #402 finished", risk: "LOW", status: "NORMAL", action: "No Action", riskCls: "risk-low", statCls: "status-normal" }
    ];

    function generateLogs() {
        const tbody = document.querySelector('#eventLogTable tbody');
        let html = '';
        const now = new Date();

        for (let i = 0; i < 15; i++) {
            const operator = operators[Math.floor(Math.random() * operators.length)];
            const machine = machines[Math.floor(Math.random() * machines.length)];
            const event = eventTypes[Math.floor(Math.random() * eventTypes.length)];

            // สร้างเวลาถอยหลัง
            const eventTime = new Date(now.getTime() - (i * 3600000));
            const dateStr = eventTime.toISOString().split('T')[0];
            const timeStr = eventTime.toTimeString().split(' ')[0];

            html += `
                <tr>
                    <td class="timestamp">
                        <div class="date">${dateStr}</div>
                        <div class="time">${timeStr}</div>
                    </td>
                    <td style="font-weight: bold;">${machine}</td>
                    <td>${event.type}</td>
                    <td style="font-size: 12px; color: rgba(255,255,255,0.7);">${event.desc}</td>
                    <td class="${event.riskCls}">${event.risk}</td>
                    <td class="${event.statCls}">${event.status}</td>
                    <td><span class="action-badge">${event.action}</span></td>
                    <td style="color: #ffcc00;">${operator}</td>
                </tr>
            `;
        }
        tbody.innerHTML = html;
    }

    // เรียกใช้งาน
    generateLogs();

    // ฟังก์ชันนาฬิกาเดิมของคุณ
    function updateClock() {
        const now = new Date();
        document.getElementById('live-clock').textContent = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>
</body>
</html>
