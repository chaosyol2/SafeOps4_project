<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Real-time Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <img src="denso.png" class="logo">
        <header class="kpi-bar">
            <div class="kpi-card"><span>Total Machines</span><strong>100</strong></div>
            <div class="kpi-card alert"><span>Active Alerts</span><strong>3</strong></div>
            <div class="kpi-card"><span>Avg Risk</span><strong>12%</strong></div>
        </header>

        <div class="main-layout">
            <section class="floor-plan">
                <div class="factory-map">
                    <div class="machine-node danger" style="top: 20%; left: 15%;">
                        <span class="label">M-A</span>
                        <div class="pulse"></div>
                    </div>
                    <div class="machine-node warning" style="top: 50%; left: 40%;">
                        <span class="label">M-B</span>
                    </div>
                    <div class="machine-node safe" style="top: 30%; left: 70%;">
                        <span class="label">M-C</span>
                    </div>
                </div>
            </section>

            <aside class="details-panel">
                <h3>Machine Details</h3>
                <div class="status-list">
                    <div class="item">Machine A <span class="badge red">82% 🔴</span></div>
                    <div class="item">Machine B <span class="badge yellow">55% 🟡</span></div>
                    <div class="item">Machine C <span class="badge green">20% 🟢</span></div>
                </div>

                <hr>

                <div class="mini-graph">
                    <p>Temp / Vibration</p>
                    <div class="graph-placeholder"></div>
                </div>
            </aside>
        </div>
    </div>
</body>
</html>
